# JVM settings tuned for low-RAM devices (e.g. building inside Termux)
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=true
kotlin.daemon.jvmargs=-Xmx1100m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builder.sdkDownload=false

# Use the aarch64-native AAPT2 provided by Termux instead of the x86_64 binary
# shipped inside the aapt2 Maven artifact (which cannot run on an arm64 host).
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
