# JVM settings tuned for low-RAM devices (e.g. building inside Termux)
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=true
kotlin.daemon.jvmargs=-Xmx1100m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builder.sdkDownload=false

# NOTA (Termux): o aapt2 do Termux precisa ser apontado fora do repositório,
# senão o build no CI (x86_64) quebra. Coloque no SEU ~/.gradle/gradle.properties:
#   android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
