name: android

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLAMA_TAG: prism-b10777-e3de715
  LLAMA_REPO: https://github.com/PrismML-Eng/llama.cpp.git
  NDK_VERSION: 28.2.13676358 # r28c — official NDK (x86_64 host only)
  # Z Fold 8 / Snapdragon 8 Elite Gen 5. Para um APK universal use FORGE_TUNE=portable.
  FORGE_TUNE: v9

jobs:
  # ---------------------------------------------------------------------------
  # 1) libllamaforge.so (llama.cpp + JNI) — build reprodutível com o NDK
  # ---------------------------------------------------------------------------
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache llama.cpp (${{ env.LLAMA_TAG }})
        uses: actions/cache@v4
        with:
          path: ~/llama.cpp
          key: llama-${{ env.LLAMA_TAG }}

      - name: Cache Android NDK r28c
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-r28c
          key: ndk-${{ env.NDK_VERSION }}

      - name: Toolchain packages
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build cmake unzip

      - name: Fetch llama.cpp + NDK
        run: |
          if [ ! -f "$HOME/llama.cpp/CMakeLists.txt" ]; then
            git clone --depth 1 --branch "$LLAMA_TAG" \
              ${LLAMA_REPO:-https://github.com/PrismML-Eng/llama.cpp.git} "$HOME/llama.cpp"
          fi
          if [ ! -d "$HOME/android-ndk-r28c" ]; then
            curl -sSLo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
            unzip -q /tmp/ndk.zip -d "$HOME"
            rm -f /tmp/ndk.zip
          fi
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r28c" >> "$GITHUB_ENV"

      - name: Build libllamaforge.so (NDK, ARMv9, 16 KB)
        run: |
          FORGE_NDK="$ANDROID_NDK_HOME" \
          FORGE_TUNE="$FORGE_TUNE" \
          JOBS="$(nproc)" \
          ./scripts/build_native.sh

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: app/src/main/jniLibs/arm64-v8a/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2) testes de unidade + APK debug (usa o .so do job anterior)
  # ---------------------------------------------------------------------------
  apk:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          # A action android-actions/setup-android@v3 quebra no cmdline-tools 16
          # (tenta instalar o pacote legado "tools", que não existe mais).
          # O runner já traz SDK + cmdline-tools; só apontamos e instalamos o resto.
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CMDLINE" >> "$GITHUB_PATH"
          echo "sdk=$SDK cmdline=$CMDLINE"

      - name: Install platform + build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;35.0.0" >/dev/null
          sdkmanager --list_installed | sed -n '1,20p'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: app/src/main/jniLibs/arm64-v8a

      - name: Restore stable debug keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Create debug keystore if missing
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        env:
          GRADLE_OPTS: -Xmx4g
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
